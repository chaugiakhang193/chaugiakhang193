name: Update profile

on:
  # Measured on this repo over 29/08-01/09: every scheduled run started 4h50m to
  # 6h30m after its slot, consistently, never on time. GitHub gives no promise
  # about when a cron fires, and this account clearly sits deep in the queue.
  #
  # So the slots below are written as "fire this early and let the drift land it
  # where we want it", not as the wall-clock times they read as. The morning slot
  # exists because a 08:23 VN slot was drifting to ~13:20 VN, leaving the profile
  # showing the previous day's streak all morning.
  schedule:
    - cron: "17 20 * * *" # nominal 03:17 VN, lands ~08:20 VN
    - cron: "17 2 * * *" # nominal 09:17 VN, lands ~14:20 VN
    - cron: "17 8 * * *" # nominal 15:17 VN, lands ~20:20 VN
    - cron: "17 14 * * *" # nominal 21:17 VN, lands ~02:20 VN
  # The reliable trigger. Cron polls and hopes; this fires the moment the data
  # actually changes, because the repo that changed it says so.
  repository_dispatch:
    types: [profile-refresh]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-profile.yml"
      - "scripts/update-readme.mjs"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PROFILE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate streak SVG
        uses: DenverCoder1/github-readme-streak-stats@51cfb8879073b4c016ce6286016de0b14d179077 # v1.7.0
        with:
          options: user=${{ github.repository_owner }}&theme=dark&hide_border=true&date_format=j/n/Y
          path: assets/streak.svg
          token: ${{ secrets.PROFILE_TOKEN }}

      - name: Quality gate — validate streak card, keep last known-good
        run: |
          card=assets/streak.svg
          bad=0
          test -s "$card" || bad=1
          grep -q '<svg' "$card" 2>/dev/null || bad=1
          grep -q 'mask_out_ring_behind_fire' "$card" 2>/dev/null || bad=1
          if grep -Eiq 'Something went wrong|Failed to retrieve|Maximum retries|>Error<' "$card" 2>/dev/null; then
            bad=1
          fi
          if [ "$bad" = "1" ]; then
            echo "::warning::streak.svg looks broken — restoring the last committed copy."
            git checkout HEAD -- "$card" 2>/dev/null || echo "::warning::No previous copy to restore (first run)."
            echo "STREAK_FRESH=false" >> "$GITHUB_ENV"
          else
            echo "streak.svg is valid."
            echo "STREAK_FRESH=true" >> "$GITHUB_ENV"
          fi

          # Whether the card actually moved. The README only links to this file, so
          # without this the script would see an unchanged README on a day when the
          # streak advanced, and would leave a stale date in the footer.
          if git diff --quiet -- "$card"; then
            echo "STREAK_CHANGED=false" >> "$GITHUB_ENV"
          else
            echo "STREAK_CHANGED=true" >> "$GITHUB_ENV"
          fi

      - name: Refresh README sections
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node scripts/update-readme.mjs

      - name: Commit and push
        env:
          # Stamp commits in Vietnam time so contributions land on the local day,
          # matching the contribution graph the way the profile owner reads it.
          TZ: Asia/Ho_Chi_Minh
        run: |
          git config user.name "chaugiakhang193"
          git config user.email "chaugiakhang193@gmail.com"
          git add README.md assets/streak.svg
          if git diff --staged --quiet; then
            echo "No changes — skipping commit."
            exit 0
          fi
          git commit -m "chore(profile): refresh activity and streak"
          git push
